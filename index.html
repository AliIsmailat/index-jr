<!doctype html>
<html lang="sv">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{{title}}</title>
    <meta name="description" content="{{description}}" />
    <meta name="theme-color" content="{{themeColorLight}}" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="{{themeColorDark}}" media="(prefers-color-scheme: dark)" />
    <style>
      /*themeCss*/
    </style>
    <script>
      ;(function () {
        var theme = 'light'
        try {
          var stored = localStorage.getItem('theme')
          if (stored === 'light' || stored === 'dark') theme = stored
          else if (matchMedia('(prefers-color-scheme: dark)').matches) theme = 'dark'
        } catch (error) {
          theme = 'light'
        }
        document.documentElement.dataset.theme = theme
      })()
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="{{fontsUrl}}"
      media="print"
      onload="this.media = 'all'"
    />
    <noscript>
      <link rel="stylesheet" href="{{fontsUrl}}" />
    </noscript>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/app/main.tsx"></script>
  </body>
</html>
